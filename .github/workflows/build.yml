name: Build binaries
on: [push, workflow_dispatch]

jobs:

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: amd64

      - name: Compile x64
        shell: cmd
        run: |
          set WDIR=%cd%
          set PLATFORM=x64
          set SUBSYS=5.02
          set ROOT=%cd%\CPP\7zip
          set OUTDIR=%WDIR%\build\bin-x64
          set ZIP7_DARKMODE=0
          set LFLAGS=/SUBSYSTEM:WINDOWS,%SUBSYS%
          set ERRFILE=
          set STOP_ON_ERROR=1
          @echo off
          call CPP\build-it.cmd -no-init
          IF %errorlevel% NEQ 0 EXIT 1
          copy %WDIR%\.github\workflows\do-release.cmd %WDIR%\build\do-release.cmd

      - name: Test x64
        shell: cmd
        run: |
          set Z7_PATH=build\bin-x64\7z.exe
          tclsh tests\7z-test.tcl -verbose tpsem

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          path: ${{ github.workspace }}\build\**\*
          name: binary-amd64

  do-release:
    runs-on: windows-latest
    needs: windows-x64
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifact
          pattern: binary-*
          merge-multiple: true

      - name: Generate x64 installer
        shell: cmd
        run: |
          cd artifact
          do-release.cmd

      - uses: geekyeggo/delete-artifact@v5
        with:
          name: binary-*

      - uses: actions/upload-artifact@v6
        with:
          name: 7-Zip ZS Release binaries
          path: |
            artifact\*.exe
            artifact\*.7z
